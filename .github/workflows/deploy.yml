name: deploy

# Manual deploy path — builds the API image and (optionally) pushes to ECR.
# Does NOT terraform-apply by default (billable). Set secrets + inputs deliberately.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR / local image tag"
        required: true
        default: "latest"
      push_ecr:
        description: "Push to AWS ECR (requires AWS credentials in repo secrets)"
        type: boolean
        default: false
      run_terraform_plan:
        description: "Run terraform plan (requires AWS credentials)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t synapse-api:${{ inputs.image_tag }} .
      - name: Save image artifact
        run: docker save synapse-api:${{ inputs.image_tag }} | gzip > synapse-api.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-api-image
          path: synapse-api.tar.gz
          retention-days: 7

  ecr-push:
    name: push ECR
    needs: [build]
    if: inputs.push_ecr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synapse-api-image
      - name: Load image
        run: gunzip -c synapse-api.tar.gz | docker load
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Prefer OIDC role when configured:
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Login + push
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REPO="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/synapse-prod-api"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag "synapse-api:${{ inputs.image_tag }}" "${REPO}:${{ inputs.image_tag }}"
          docker push "${REPO}:${{ inputs.image_tag }}"
          echo "Pushed ${REPO}:${{ inputs.image_tag }}"

  terraform-plan:
    name: terraform plan
    if: inputs.run_terraform_plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init + plan
        env:
          TF_VAR_jwt_secret: ${{ secrets.SYNAPSE_JWT_SECRET }}
          TF_VAR_groq_api_key: ${{ secrets.SYNAPSE_GROQ_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.SYNAPSE_OPENAI_API_KEY }}
        run: |
          terraform init -backend=false
          terraform plan -input=false -no-color
