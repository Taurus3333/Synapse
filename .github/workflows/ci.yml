name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SYNAPSE_ENV: ci
  SYNAPSE_JWT_SECRET: ci-only-synapse-jwt-secret-key-32chars!!
  SYNAPSE_DEMO_PASSWORD: synapse-demo
  SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@127.0.0.1:5432/synapse
  SYNAPSE_REDIS_URL: redis://127.0.0.1:6379/0
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy

  test:
    name: unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Enable pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=synapse psql -h 127.0.0.1 -U synapse -d synapse \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Pytest
        run: pytest -q --tb=short
      - name: E2E (ASGI)
        run: pytest -q -m e2e --tb=short

  eval:
    name: golden eval gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Enable pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=synapse psql -h 127.0.0.1 -U synapse -d synapse \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: synapse-eval
        run: synapse-eval --profile ci --seed 42 --out eval_report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json

  redteam:
    name: security / red-team gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with PyRIT)
        run: python -m pip install --upgrade pip && pip install -e ".[dev,redteam]"
      - name: Enable pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=synapse psql -h 127.0.0.1 -U synapse -d synapse \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Pytest redteam marker
        run: pytest -q -m redteam --tb=short
      - name: synapse-redteam CLI
        run: synapse-redteam --out redteam_report.json
      - name: Upload redteam report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam_report.json

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: pip-audit
        # Skip the editable synapse package itself (not on PyPI); audit its deps.
        run: pip-audit --skip-editable

  infra:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  image:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t synapse-api:ci .

  ci-ok:
    name: all gates green
    runs-on: ubuntu-latest
    needs: [lint, test, eval, redteam, audit, infra, image]
    steps:
      - run: echo "CI gates passed (lint, test, eval, redteam, audit, terraform, image)"
